<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>れいたくん変身</title>
<style>
  :root{ --bg1:#1b1030; --bg2:#35195c; --orange:#ff8a1f; --purple:#8e4dff; --ink:#fff4e0; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; background:#22123b; color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif; user-select:none; -webkit-user-select:none; overflow:hidden}
  button{font-family:inherit; border:0; border-radius:28px; padding:14px 34px; font-weight:bold; font-size:17px;
    background:var(--orange); color:#2a1000; cursor:pointer; box-shadow:0 5px 0 #b35500}
  button:active{transform:translateY(4px); box-shadow:0 1px 0 #b35500}
  button.ghost{background:transparent; color:var(--ink); border:2px solid var(--purple); box-shadow:none; padding:7px 18px; font-size:13px}
  @keyframes fadein{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  a.ghost,a.btnlink{display:inline-block; text-decoration:none; font-family:inherit; border-radius:28px; font-weight:bold; cursor:pointer; text-align:center}
  a.btnlink{padding:14px 34px; font-size:17px; background:var(--orange); color:#2a1000; box-shadow:0 5px 0 #b35500}
  a.btnlink:active{transform:translateY(4px); box-shadow:0 1px 0 #b35500}
  a.ghost{background:transparent; color:var(--ink); border:2px solid var(--purple); padding:7px 18px; font-size:13px}

  /* ===== 変身シーン（スタンプ5つそろったとき） ===== */
  .hen{position:fixed; inset:0; z-index:90; display:none; background:#22123b center bottom / cover no-repeat}
  .hen::before{content:""; position:absolute; inset:0; background:linear-gradient(rgba(20,8,40,.6), rgba(20,8,40,.12) 45%, rgba(20,8,40,.35)); pointer-events:none}
  .hen.show{display:block; animation:fadein .4s ease-out}
  .henstage{position:absolute; left:0; right:0; top:96px; bottom:96px; display:flex; align-items:flex-end; justify-content:center}
  .hen.fin .henstage{bottom:200px}
  .henstage img{height:100%; max-width:94%; object-fit:contain; filter:drop-shadow(0 8px 8px rgba(0,0,0,.55)); transition:none}
  .henstage img.shake{animation:hshake .1s infinite}
  .henstage img.glow{filter:drop-shadow(0 0 18px #fff) drop-shadow(0 0 40px var(--orange))}
  .henstage img.pop{animation:hpop .8s cubic-bezier(.2,1.6,.4,1)}
  @keyframes hshake{0%{transform:translate(-5px,0) rotate(-2.5deg)}50%{transform:translate(5px,0) rotate(2.5deg)}100%{transform:translate(-5px,0) rotate(-2.5deg)}}
  @keyframes hpop{0%{transform:scale(.2) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
  .henmsg{position:absolute; left:0; right:0; margin:0 auto; bottom:max(132px,calc(env(safe-area-inset-bottom) + 112px)); z-index:2; display:none;
    width:max-content; max-width:calc(100% - 32px); padding:10px 20px; border-radius:28px; background:rgba(20,8,40,.82); border:2px solid var(--orange);
    font-weight:bold; font-size:17px; text-align:center; color:#fff; text-shadow:0 1px 0 #000}
  .hen.fin .henmsg{display:block; animation:fadein .6s .3s both}
  .hencap{position:absolute; top:max(26px,env(safe-area-inset-top)); left:0; right:0; z-index:2; text-align:center; padding:0 16px;
    font-weight:bold; font-size:21px; color:#fff; text-shadow:0 2px 0 #000, 0 0 12px rgba(0,0,0,.7); animation:fadein .5s both}
  .hencap.big{font-size:30px; color:var(--orange)}
  .hencap small{display:block; font-size:15px; color:#fff; margin-bottom:2px}
  .hflash{position:absolute; inset:0; z-index:3; background:#fff; opacity:0; pointer-events:none}
  .hflash.go{animation:hflash 1s ease-out}
  @keyframes hflash{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
  .hfx{position:absolute; left:50%; top:62%; z-index:2; font-size:28px; pointer-events:none; animation:hfly 1.7s ease-out forwards}
  @keyframes hfly{0%{opacity:1; transform:translate(0,0) scale(.5)}100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(200deg)}}
  .henbtns{position:absolute; left:0; right:0; bottom:max(22px,env(safe-area-inset-bottom)); z-index:2; display:none; flex-direction:column; align-items:center; gap:10px}
  .hen.fin .henbtns{display:flex; animation:fadein .5s both}
</style>
</head>
<body>
<div class="hen" id="hen" role="dialog" aria-label="れいたくん変身">
  <div class="hencap" id="hencap"></div>
  <div class="henstage" id="henstage"><img id="henimg" alt="れいたくん"></div>
  <div class="hflash" id="hflash"></div>
  <div class="henmsg" id="henmsg">受付に戻ってお菓子をもらおう！</div>
  <div class="henbtns">
    <button class="ghost" id="henAgain" type="button">もう一度変身を見る</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// ?reset=1 を付けて開くとスタンプを全部消す（テスト・やり直し用。各ゲームと共通のキー）
try{
  const u = new URL(location.href);
  if(u.searchParams.get("reset") === "1"){
    localStorage.setItem("trickqr_stamps_v1", JSON.stringify([false,false,false,false,false]));
    u.searchParams.delete("reset");
    history.replaceState(null, "", u.pathname + u.search + u.hash);
  }
}catch(e){}

  Object.values(HEN).forEach(u=>{ const i=new Image(); i.src=u; });   // 先読み
  let timers=[], last=-1;
  const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
  const clearT=()=>{ timers.forEach(clearTimeout); timers=[]; };

  function burst(){
    const FX=["🎃","🦇","⭐","👻","✨"];
    for(let i=0;i<20;i++){
      const e=document.createElement("div"); e.className="hfx"; e.textContent=FX[i%FX.length];
      e.style.marginLeft="-14px";
      e.style.setProperty("--dx",(Math.random()*340-170)+"px");
      e.style.setProperty("--dy",(Math.random()*-300-20)+"px");
      hen.appendChild(e); setTimeout(()=>e.remove(),1800);
    }
  }
  function play(){
    clearT();
    hen.classList.remove("fin"); hen.classList.add("show");
    img.className=""; img.src=HEN.base;
    cap.className="hencap"; cap.textContent="れいたくんの様子が…？";
    // 3種類のうちランダム（直前と同じでもOK）
    const f = FORMS[Math.floor(Math.random()*FORMS.length)];
    later(()=>img.classList.add("shake"), 900);
    later(()=>img.classList.add("glow"), 1800);
    later(()=>{ const fl=$("hflash"); fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go"); burst();
                try{ navigator.vibrate && navigator.vibrate([60,40,120]); }catch(e){} }, 2500);
    later(()=>{
      img.className=""; void img.offsetWidth;
      img.src=HEN[f.k]; img.classList.add("pop");
      cap.className="hencap big"; cap.innerHTML = `<small>変身！</small>${f.n}`;
    }, 2700);
    later(()=>hen.classList.add("fin"), 3800);
  }
  function close(){ clearT(); hen.classList.remove("show","fin"); }

  $("henAgain").addEventListener("click", play);
  play();   // 開いたらすぐ変身スタート
})();
